name: cropin_voice_agents
description: "Cropin Grow voice agents - offline, multilingual (English, Hindi, Kannada, Tamil) voice assistants for field operations."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.0
  camera: ^0.11.0
  geolocator: ^13.0.0
  sherpa_onnx: ^1.13.8
  record: ^7.1.2
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
