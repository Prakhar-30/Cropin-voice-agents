name: Build APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Analyze & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Unit tests (offline NLU engine)
        run: flutter test

  build:
    name: Build release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        # Creates any missing Android scaffolding (Gradle files, MainActivity, icons).
        # Existing files such as AndroidManifest.xml and lib/ are kept as they are.
        run: flutter create --platforms=android --org com.cropin --project-name cropin_voice_agents .

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk cropin-voice-agents.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cropin-voice-agents-apk
          path: cropin-voice-agents.apk

      - name: Publish GitHub release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v1.0.${{ github.run_number }}
          name: Cropin Voice Agents APK v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: cropin-voice-agents.apk
          body: |
            Cropin Grow offline voice agents (English, Hindi, Kannada, Tamil).
            Built from ${{ github.ref_name }} @ ${{ github.sha }}.
